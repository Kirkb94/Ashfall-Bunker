<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ashfall Bunker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231a120a%22/%3E%3Crect x=%224%22 y=%227%22 width=%228%22 height=%227%22 fill=%22%23ffb347%22/%3E%3Crect x=%222%22 y=%225%22 width=%2212%22 height=%222%22 fill=%22%237a6650%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07060a; --panel:rgba(20,16,12,.94); --line:#4a3a22; --fg:#f1e6d2; --muted:#b8a78a; --amber:#ffb347; --amber2:#ff8c2a;
    --red:#ff5a4e; --green:#7ddc6f; --blue:#7fc8ff; --font:'IBM Plex Sans',system-ui,sans-serif; --disp:'Chakra Petch',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font);overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  #wrap{position:relative;width:1280px;height:720px;transform-origin:center center;background:#000;box-shadow:0 0 60px rgba(255,140,42,.08)}
  canvas{display:block;width:1280px;height:720px;image-rendering:auto;cursor:crosshair}
  button{font:inherit;color:inherit;cursor:pointer}
  .hud{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:14px;padding:0 12px;background:linear-gradient(#120d08ee,#120d08aa);border-bottom:1px solid var(--line);font-size:13.5px;pointer-events:none}
  .hud *{pointer-events:auto}
  .clock{font:700 17px var(--disp);letter-spacing:.04em;color:var(--amber);min-width:128px}
  .res{display:flex;gap:12px;flex-wrap:nowrap}
  .res span{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .res i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .res b{font-weight:600}
  .res .low{color:var(--red)}
  .res .lowres{padding:0 5px;border-radius:4px;outline:1.5px dashed var(--red);outline-offset:0;background:repeating-linear-gradient(135deg,#ff5a4e33 0 4px,transparent 4px 8px);animation:lowflash 1.1s ease-in-out infinite}
  .res .lowico{font-style:normal;color:var(--red);font-weight:700}
  .res .lowtag{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--red)}
  @keyframes lowflash{0%,100%{background-color:transparent}50%{background-color:#ff5a4e44}}
  body.hc .res .lowres{outline:2px solid #fff;background:repeating-linear-gradient(135deg,#fff3 0 4px,#000 4px 8px);animation:lowflashHc 1.1s steps(2,jump-none) infinite}
  @keyframes lowflashHc{0%{background-color:#000}100%{background-color:#b00020}}
  body.hc .res .lowres .low::before,body.cb .res .lowres .low::before{content:none}
  body.hc .res .lowres .low,body.hc .res .lowres .lowico,body.hc .res .lowres .lowtag{color:#fff}
  body.hc .res .low{color:#fff}
  .spd{display:flex;gap:2px;margin-left:auto}
  .spd button{background:#1d160e;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12.5px}
  .spd button.on{background:var(--amber);color:#1a0f02;border-color:var(--amber);font-weight:700}
  .threat{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .threat.hot{color:var(--red);font-weight:600}
  .log{position:absolute;right:12px;top:46px;width:470px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  .dopen .log{right:406px}
  .dopen #goals{display:none}
  .log div{background:rgba(14,10,6,.82);border-left:3px solid var(--amber);padding:5px 9px;border-radius:0 6px 6px 0;font-size:13px;animation:fade .3s ease}
  .log div.warn{border-left-color:var(--red)}
  .log div.good{border-left-color:var(--green)}
  .log div[data-ev]{pointer-events:auto;cursor:pointer}
  .log div[data-ev]:hover{background:rgba(40,28,14,.95)}
  .evlog{display:flex;flex-direction:column;gap:4px}
  .evlog .ev{background:rgba(14,10,6,.6);border-left:3px solid var(--amber);padding:5px 8px;border-radius:0 6px 6px 0;font-size:12.5px}
  .evlog .ev.warn{border-left-color:var(--red)}
  .evlog .ev.good{border-left-color:var(--green)}
  .evlog .ev.go{cursor:pointer}
  .evlog .ev.go:hover{background:rgba(40,28,14,.9)}
  .evlog .evt{color:var(--muted);font-size:11px;margin-right:6px}
  .evlog em{color:var(--amber);font-style:normal}
  .log b{color:var(--amber);font-family:var(--disp);letter-spacing:.06em;font-size:11.5px;margin-right:6px}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}}
  .tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
  .tools button[hidden]{display:none}
  .tools button{background:rgba(34,27,19,.98);border:1px solid #7a6238;border-radius:8px;padding:7px 12px;font-size:13px;color:var(--fg);transition:background .12s,border-color .12s,color .12s}
  .tools button:hover{border-color:var(--amber);background:rgba(58,44,26,.98);color:#fff}
  .tools button:active{background:rgba(26,19,10,.98);border-color:var(--amber2);transform:translateY(1px)}
  .tools button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tools kbd{font:600 11px var(--disp);opacity:.85;margin-left:5px}
  .prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);border-radius:8px;padding:7px 14px;font-weight:600;pointer-events:none;white-space:nowrap}
  .prompt:empty{display:none}
  .drawer{position:absolute;top:46px;right:8px;bottom:8px;width:388px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .drawer[hidden]{display:none}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;padding:10px 6px;font:600 13px var(--disp);letter-spacing:.08em;color:var(--muted)}
  .tabs button.on{color:var(--amber);box-shadow:inset 0 -2px var(--amber)}
  .tabs .x{flex:0 0 40px}
  .dbody{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
  .scrollcue{flex:none;display:block;box-sizing:border-box;width:100%;text-align:center;padding:4px 0;font:600 11px var(--disp);letter-spacing:.1em;color:var(--amber);background:linear-gradient(to bottom,rgba(255,179,71,.14),transparent);border-top:1px solid var(--line);pointer-events:none;visibility:hidden}
  .scrollcue.show{visibility:visible}
  @media (prefers-reduced-motion:no-preference){.scrollcue.show span{display:inline-block;animation:scrollcueBob 1.4s ease-in-out infinite}}
  @keyframes scrollcueBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  .card{background:#1b140c;border:1px solid #3a2c18;border-radius:9px;padding:9px 10px}
  .card.sel{border-color:var(--amber)}
  .card.dead{opacity:.5}
  .ch{display:flex;align-items:center;gap:8px}
  .sw{width:14px;height:14px;border-radius:4px;flex:none}
  .ch b{font-size:14.5px}
  .tag{font-size:11.5px;color:var(--muted)}
  .lvl{margin-left:auto;font:600 11.5px var(--disp);color:var(--amber)}
  .bars{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;align-items:center;margin:7px 0 6px;font-size:11.5px;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:#2d2215;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .row{display:flex;flex-wrap:wrap;gap:4px}
  .chip{background:#241a0f;border:1px solid #47361e;border-radius:6px;padding:3px 7px;font-size:12px}
  .chip:hover{border-color:var(--amber)}
  .sched{display:flex;gap:1px;margin-top:4px}
  .sched .sc{flex:1;min-width:0;height:14px;border-radius:2px;cursor:pointer;background:#2d2215}
  .sched .scS{background:#3f7fb5}
  .sched .scW{background:#6b5226}
  .sched .scM{background:#6fae5a}
  .sched .sc.now{outline:2px solid #fff;outline-offset:0;position:relative}
  .chip.on{background:var(--amber);border-color:var(--amber);color:#1a0f02;font-weight:600}
  .chip:disabled{opacity:.35;cursor:not-allowed}
  .note{font-size:12px;color:var(--muted);margin-top:5px}
  .note.bad{color:var(--red)}
  .sec{font:600 12px var(--disp);letter-spacing:.12em;color:var(--muted);margin:4px 0 -2px}
  .bitem{display:flex;align-items:center;gap:10px}
  .bitem div{flex:1;min-width:0}
  .bitem p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .cost{font-size:12px;color:var(--amber)}
  .btn{background:var(--amber);color:#1a0f02;border:0;border-radius:7px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
  .btn:disabled{background:#3a2c18;color:#8a7a60;cursor:not-allowed}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
  .stages{display:flex;flex-direction:column;gap:6px}
  .stage{display:flex;gap:10px;align-items:flex-start}
  .stage .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--disp);background:#2d2215;flex:none}
  .stage.done .n{background:var(--green);color:#082006}
  .stage.cur .n{background:var(--amber);color:#1a0f02}
  .overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(60,30,8,.55),rgba(4,3,2,.94));display:grid;place-items:center;text-align:center}
  .overlay[hidden]{display:none}
  .menu{width:560px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .menu h1{margin:0;font:700 64px/1 var(--disp);letter-spacing:.08em;color:var(--amber);text-shadow:0 0 30px rgba(255,140,42,.35)}
  .menu .sub{margin:0;color:var(--muted);font-size:16px;max-width:520px}
  .menu .summary{text-align:left;margin:10px auto;max-width:520px;font-size:15px;line-height:1.5}
  .menu .summary-title{margin-top:8px}
  .menu .summary-moments{max-height:140px;overflow:auto;margin:4px 0 0;padding-left:20px}
  .menu .btn{font-size:16px;padding:11px 26px;min-width:240px}
  .menu .btn.ghost{font-size:15px}
  .help{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;max-height:430px;overflow:auto;font-size:14px}
  .help h3{margin:10px 0 4px;font:600 14px var(--disp);letter-spacing:.1em;color:var(--amber)}
  .help ul{margin:0;padding-left:18px}
  .help kbd{font:600 12px var(--disp);background:#2d2215;border-radius:4px;padding:1px 5px}
  .help dl.keylist{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
  .help dl.keylist dt,.help dl.keylist dd{margin:0}
  .scavhud{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 14px;font-size:13px;display:flex;gap:14px;align-items:center}
  .scavhud[hidden]{display:none}
  /* touch controls */
  html,body,canvas,#wrap{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .dbody{touch-action:pan-y}
  #touch{display:none}
  body.touch #touch{display:block}
  #touch[hidden]{display:none!important}
  #touch .pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:grid;gap:8px}
  #touch button[data-act].idle{opacity:.45}
  #touch .pl{left:max(14px,env(safe-area-inset-left));grid-template-columns:repeat(3,88px);grid-template-rows:repeat(2,88px)}
  #touch .pr{right:max(14px,env(safe-area-inset-right));grid-template-columns:repeat(3,92px);grid-template-rows:92px}
  #touch button{border-radius:50%;border:2px solid var(--line);background:rgba(20,16,12,.62);color:var(--fg);font:700 22px var(--disp);touch-action:none;padding:0}
  #touch button.on{background:rgba(255,179,71,.75);color:#1a0f02;border-color:var(--amber)}
  #touch button.rdy{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,71,.45)}
  #touch .up{grid-column:2;grid-row:1}
  #touch .lf{grid-column:1;grid-row:2}
  #touch .dn{grid-column:2;grid-row:2}
  #touch .rt{grid-column:3;grid-row:2}
  #touch .shoot{border-color:var(--red)}
  #touch .tpause{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,var(--sab,0px));width:var(--tap,44px);height:var(--tap,44px);padding:0;font-size:14px;letter-spacing:-2px;opacity:.85}
  @media (max-height:430px),(max-width:700px){
    #touch .pl{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,62px);gap:6px}
    #touch .pr{grid-template-columns:repeat(3,66px);grid-template-rows:66px;gap:6px}
    #touch button{font-size:16px}
  }
  #rotate{display:none;position:fixed;left:0;right:0;top:0;padding:8px;text-align:center;background:var(--amber);color:#1a0f02;font:700 14px var(--disp);z-index:9;pointer-events:none}
  @media (orientation:portrait){body.touch #rotate{display:block}}
  body.touch .tools{bottom:auto;top:44px;left:12px}
  body.touch .tools button{padding:11px 14px;font-size:15px}
  body.touch .hud{font-size:15px;gap:10px;height:42px}
  body.touch .res{gap:8px}
  body.touch .spd button{padding:6px 12px;font-size:15px}
  body.touch .log,body.touch .scavhud{top:50px}
  body.touch .drawer{top:50px;bottom:116px;width:470px}
  body.touch .tools kbd{display:none}
  body.touch .tools{gap:4px;max-width:740px;flex-wrap:wrap}
  body.touch .clock{min-width:0;white-space:nowrap}
  body.touch .res{min-width:0;overflow:hidden;gap:6px}
  body.touch .hud{overflow:hidden}
  body.touch .spd{flex:none}
  html,body{overscroll-behavior:none}
  body.touch .dopen .log{right:486px}
  body.touch .tabs button{padding:15px 6px;font-size:15px}
  body.touch .chip{padding:8px 12px;font-size:14px}
  body.touch .btn{padding:10px 16px;font-size:15px}
  body.touch .dbody{font-size:15px}
  body.touch .prompt{bottom:118px;font-size:15px}
  body.touch #touch .pl{left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
  body.touch #touch .pr{right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
  @media (max-height:480px),(max-width:760px){
    #touch .pl{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}
    #touch .pr{grid-template-columns:repeat(3,68px);grid-template-rows:68px;gap:6px}
    #touch button{font-size:18px}
    body.touch .drawer{width:min(470px,calc(100vw - 24px));bottom:92px}
    body.touch .dopen .log{right:calc(min(470px,100vw - 24px) + 16px)}
    body.touch .prompt{bottom:92px}
    body.touch .hint{bottom:100px;max-width:calc(100% - 300px)}
    body.touch .tools{max-width:calc(100% - 24px)}
  }
  .hint{position:absolute;left:50%;bottom:calc(12px + 2 * 36px + 14px);max-width:calc(100% - 24px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);border-radius:8px;padding:7px 8px 7px 14px;font-weight:600;display:flex;gap:10px;align-items:center;white-space:normal;animation:fade .3s ease}
  .hint[hidden]{display:none}
  .hint kbd{font:600 12px var(--disp);background:#2d2215;border-radius:4px;padding:1px 5px}
  .hint button{background:none;border:1px solid var(--line);border-radius:5px;padding:1px 7px}
  body.touch .hint{bottom:170px;font-size:15px}
  .hint .hintbody{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
  .hint button{white-space:nowrap;min-height:28px}
  .help:focus-visible,.menu .btn:focus-visible,.hint button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .help .touchonly{display:none}
  body.touch .help .touchonly{display:list-item}
  /* responsive touch layout: --u is set by fit() (1 on big screens, up to 1.7 on phones) */
  body.touch .hud{font-size:calc(15px*var(--u,1));height:calc(42px*var(--u,1));gap:calc(10px*var(--u,1))}
  body.touch .clock{font-size:calc(17px*var(--u,1))}
  body.touch .threat{font-size:calc(12.5px*var(--u,1))}
  body.touch .spd button{font-size:calc(15px*var(--u,1));padding:calc(6px*var(--u,1)) calc(12px*var(--u,1))}
  body.touch .tools{top:calc(46px*var(--u,1));max-width:calc(100% - 24px)}
  body.touch .tools button{font-size:calc(15px*var(--u,1));padding:calc(10px*var(--u,1)) calc(13px*var(--u,1))}
  body.touch .log,body.touch .scavhud{top:calc(50px*var(--u,1));font-size:calc(13px*var(--u,1))}
  body.touch .log{width:calc(470px*var(--u,1));max-width:45%}
  body.touch .log div{font-size:calc(13px*var(--u,1))}
  body.touch .dopen .log{right:calc(470px*var(--u,1) + 16px)}
  body.touch .drawer{top:calc(50px*var(--u,1));bottom:calc(88px*var(--u,1) + 22px);width:calc(470px*var(--u,1));max-width:58%}
  body.touch .dbody{font-size:calc(15px*var(--u,1))}
  body.touch .tabs button{font-size:calc(15px*var(--u,1))}
  body.touch .chip{font-size:calc(14px*var(--u,1))}
  body.touch .btn{font-size:calc(15px*var(--u,1))}
  body.touch .prompt{bottom:calc(88px*var(--u,1) + 22px);font-size:calc(15px*var(--u,1))}
  #touch .pl{left:max(14px,var(--sal,0px));bottom:max(14px,var(--sab,0px));grid-template-columns:repeat(3,calc(80px*var(--u,1)));grid-template-rows:repeat(2,calc(80px*var(--u,1)))}
  #touch .pr{right:max(14px,var(--sar,0px));bottom:max(14px,var(--sab,0px));grid-template-columns:repeat(3,calc(84px*var(--u,1)));grid-template-rows:calc(84px*var(--u,1))}
  #touch button{font-size:calc(20px*var(--u,1))}
  body.touch .menu{max-width:92%}
  body.touch .help{max-height:calc(430px*var(--u,1))}
  /* safe-area insets + minimum tap size (vars set by fit() in game.js) */
  body.touch .hud{padding-left:max(12px,var(--sal,0px));padding-right:max(12px,var(--sar,0px))}
  body.touch .tools{left:max(12px,var(--sal,0px))}
  body.touch .tools button,body.touch .chip,body.touch .tabs button,body.touch .btn,body.touch .spd button{min-height:var(--tap,44px)}
  /* accessibility: reduced motion */
  body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
  /* accessibility: colorblind (icons + patterns instead of color alone) */
  /* accessibility: high contrast (opaque panels, white text/borders, boxed warnings) */
  body.hc{--panel:#000;--line:#fff;--fg:#fff;--muted:#e6e6e6;--amber:#ffd24a;--red:#ff7b6e}
  body.hc .hud{background:#000;border-bottom:2px solid #fff;font-weight:600}
  body.hc .res .low{color:#fff;background:#b00020;outline:2px solid #fff;padding:0 4px;border-radius:3px;font-weight:800}
  body.hc .res .low::before{content:'\26A0\FE0E ';display:inline-block}
  body.hc .res i{outline:1px solid #fff}
  body.hc .tools button,body.hc .btn,body.hc .tabs button{border:2px solid #fff;background:#000;color:#fff}
  body.hc .log div{background:#000;color:#fff}
  body.hc .overlay{background:#000!important}
  body.hc .menu,body.hc .menu .sub,body.hc .menu h1,body.hc .setp,body.hc .setp h3,body.hc .help{color:#fff!important;text-shadow:none!important}
  body.hc .setp,body.hc .drawer{background:#000!important;border:2px solid #fff!important}
  body.hc .setp h3{color:var(--amber)!important}
  body.hc .drawer,body.hc .drawer *{color:#fff}
  body.hc .tsrow .btn[aria-pressed="true"]{background:#fff!important;color:#000!important;border-color:#fff!important}
  body.hc input[type=range]{accent-color:#fff;outline:1px solid #fff}
  body.hc .btn:focus-visible,body.hc button:focus-visible,body.hc input:focus-visible{outline:3px solid #ffd24a!important;outline-offset:2px}
  body.hc .prompt,body.hc .hint{background:#000;color:#fff;border:2px solid #fff}
  body.cb .res .low{text-decoration:underline}
  body.cb .res .low::before{content:'\26A0\FE0E ';text-decoration:none;display:inline-block}
  body.cb .threat.hot::before{content:'\203C\FE0E ';}
  body.cb .log div.warn::before{content:'\26A0\FE0E ';color:#fff}
  body.cb .log div.good::before{content:'\2714\FE0E ';color:#fff}

<script type="text/plain" data-moved-to="scrollcue.js">
/* Not run: moved to scrollcue.js because the server's CSP blocks inline scripts. 'Scroll for more' cue: an in-flow row after each scrollable panel, so it never covers content or buttons. */
(function(){
  var SEL='.dbody,.help,.setp,[data-scrollcue]';
  function cueFor(el){
    var n=el.nextElementSibling;
    if(n&&n.classList.contains('scrollcue'))return n;
    if(!el.parentNode)return null;
    n=document.createElement('div');
    n.className='scrollcue';
    n.setAttribute('aria-hidden','true');
    n.innerHTML='<span>\u25BC Scroll for more</span>';
    el.insertAdjacentElement('afterend',n);
    return n;
  }
  function update(el){
    var c=cueFor(el);
    if(!c)return;
    var more=el.offsetParent!==null&&el.scrollHeight-el.clientHeight>4&&el.scrollTop+el.clientHeight<el.scrollHeight-4;
    c.classList.toggle('show',!!more);
  }
  function scan(){
    var els=document.querySelectorAll(SEL);
    for(var i=0;i<els.length;i++)update(els[i]);
  }
  document.addEventListener('scroll',function(e){
    var t=e.target;
    if(t&&t.matches&&t.matches(SEL))update(t);
  },true);
  window.addEventListener('resize',scan);
  setInterval(scan,300);
})();
</script>
